<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>共享导航</title>
  <link rel="stylesheet" href="css/style.css?v=202609230133" />
</head>
<body>
  <!-- 顶栏（搜索引擎搜索已上移至此处） -->
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="切换导航">☰</button>
    <!-- 顶栏左上角的站点名称 + 站点描述：与正文中间的 .hero（主页中心模块）
         是两套独立内容，文字与字号都在后台「首页设置」里分开设置。
         两行文字各自的字号由两个滑块控制（--title-size / --subtitle-size），
         所以这里不用写死 font-size。 -->
    <div class="brand">
      <!-- 站点图标：#siteLogo 的内容由 app.js 的 renderHead() 用 js/logos.js 填充。
           支持三种值（见 js/logos.js 顶部说明）：内置光伏图标 id（如 pv:panel，
           渲染为内联 SVG）、emoji/短文字、图片地址。
           图标大小跟着「顶栏名称字号」等比缩放（CSS 里用 1em），所以这里不写死尺寸。 -->
      <span id="siteLogo">🌐</span>
      <span class="brand-text">
        <span id="siteTitle">共享导航</span>
        <span id="siteDesc">智能多功能响应式导航</span>
      </span>
    </div>

    <div class="tb-searches">
      <!-- 搜索引擎网页搜索 -->
      <div class="ws-wrap">
        <form class="ws-form" id="wsForm" autocomplete="off" role="search">
          <div class="ws-input-wrap">
            <span class="ws-badge" id="wsBadge" title="切换搜索引擎" role="button">百</span>
            <!-- type="search" 是刻意的：Chrome / Edge 的密码管理器会把保存的账号名
                 填进 type="text" 的顶部文本框（并触发 input 事件 → 页面一打开就
                 "自动搜索"了账号名）。search 类型不会被当作凭据字段，从根上挡住。 -->
            <input type="search" id="wsInput" name="nav-web-q" placeholder="搜索网页内容…"
                   aria-label="搜索关键词" autocomplete="off" autocorrect="off"
                   autocapitalize="off" spellcheck="false" />
            <button type="button" class="ws-clear" id="wsClear" title="清除" aria-label="清除关键词">✕</button>
          </div>
          <button type="submit" class="ws-go" id="wsGo" title="开始搜索">🔍<span class="ws-go-txt"> 搜索</span></button>
        </form>
        <!-- 引擎列表：点左侧徽标展开 / 收起 -->
        <div class="ws-engines" id="wsEngines" aria-label="切换搜索引擎"></div>
      </div>

      <!-- 站内站点 / 分类搜索 -->
      <div class="search-box">
        <!-- 同上：必须保持 type="search"，不要改回 text，否则浏览器会自动填入账号名 -->
        <input type="search" id="searchInput" name="nav-site-q" placeholder="搜索站点 / 分类…"
               aria-label="搜索站点或分类" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" />
        <span class="search-clear" id="searchClear" title="清除">✕</span>
      </div>
    </div>

    <button class="theme-toggle" id="themeToggle" title="切换深色 / 浅色">🌓</button>
    <button class="acct-btn" id="acctBtn" title="登录 / 注册 / 我的申请">
      <span id="acctIcon">👤</span><span class="acct-txt" id="acctTxt">登录</span>
    </button>
    <a class="admin-link" href="admin.html" title="AI 自动收录 / 管理">＋<span class="al-txt"> AI 收录</span></a>
  </header>

  <div class="layout">
    <!-- 左侧导航栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="mini-panel" id="miniPanel">
        <div class="mini-card mini-weather" id="weatherCard">
          <div class="mini-loading">🌤️ 定位中…</div>
        </div>
        <div class="mini-card mini-calendar" id="calendarCard">
          <div class="mini-loading">📅 加载中…</div>
        </div>
      </div>
      <nav class="side-nav" id="sideNav">
        <a class="side-item fav-entry" data-target="__fav" href="#__fav">⭐ 常用收藏 <span class="fav-count" id="favCount">0</span></a>
        <a class="side-item active" data-target="all" href="#all">🏠 全部</a>
        <!-- 分类由 JS 注入 -->
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="sidebar-mask" id="sidebarMask"></div>

    <!-- 主内容区 -->
    <main class="content" id="content">
      <!-- 主页中心模块：站点名称（大标题）+ 站点描述（副标题）。
           与顶栏左上角那份是**两套独立内容** —— 文字与字号都在后台
           「首页设置」里分开设置（中心名称/描述留空时回落到站点名称/描述，
           所以默认看起来与顶栏一致）。字号走 --hero-title-size / --hero-sub-size。 -->
      <section class="hero" id="hero">
        <h1 id="heroTitle">共享导航</h1>
        <p id="heroSub">智能多功能响应式导航</p>
      </section>
      <div id="sections"><!-- 分类区块由 JS 注入 --></div>
      <footer class="footer" id="footer"></footer>
    </main>
  </div>

  <!-- 登录 / 注册 弹窗（访问者账户） -->
  <div class="modal-mask" id="authMask" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="登录或注册">
      <button class="modal-x" id="authX" title="关闭">✕</button>
      <div class="modal-tabs">
        <button class="mtab active" id="tabLogin" type="button">登录</button>
        <button class="mtab" id="tabRegister" type="button">注册</button>
      </div>

      <div class="mpane" id="paneLogin">
        <!-- 这层 form 元素是刻意加的：给浏览器的密码管理器一个明确的作用域边界。
             没有它时，账号 / 密码字段的作用域会被放大到整个页面，浏览器可能把
             保存的账号名填进顶部的搜索框（2026-09 线上实际反馈）。
             按钮保持 type="button"，提交由 app.js 处理，表单永远不会真的提交。 -->
        <form id="loginForm">
          <label class="fl" for="loginUser">账号</label>
          <input type="text" id="loginUser" name="username" placeholder="账号" autocomplete="username" />
          <label class="fl" for="loginPwd">密码</label>
          <input type="password" id="loginPwd" name="password" placeholder="密码" autocomplete="current-password" />
          <label class="chk"><input type="checkbox" id="loginRemember" checked /> 记住登录（30 天）</label>
          <button class="btn primary block" id="doLogin" type="button">登录</button>
          <p class="modal-msg" id="loginMsg"></p>
        </form>
      </div>

      <div class="mpane hidden" id="paneRegister">
        <!-- 同上：用 form 元素圈定作用域，避免浏览器把账号名灌进别处的文本框 -->
        <form id="regForm">
          <label class="fl" for="regUser">账号</label>
          <input type="text" id="regUser" name="new-username" placeholder="3-20 位字母、数字、下划线" autocomplete="username" />
          <label class="fl" for="regNick">昵称（可选）</label>
          <input type="text" id="regNick" name="nickname" placeholder="显示用的名字" autocomplete="off" />
          <label class="fl" for="regPwd">密码</label>
          <input type="password" id="regPwd" name="new-password-field" placeholder="至少 6 位" autocomplete="new-password" />
          <label class="fl" for="regReason">申请说明（可选）</label>
          <input type="text" id="regReason" name="apply-reason" placeholder="简单说明来意，便于管理员审核" autocomplete="off" />
          <button class="btn primary block" id="doRegister" type="button">提交注册</button>
          <p class="hint">注册后需管理员审核通过才能登录。</p>
          <p class="modal-msg" id="regMsg"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- 用户中心弹窗（提交申请 / 查看我的申请） -->
  <div class="modal-mask" id="userMask" hidden>
    <div class="modal wide" role="dialog" aria-modal="true" aria-label="我的账户">
      <button class="modal-x" id="userX" title="关闭">✕</button>
      <h4 class="modal-title">我的账户 <span class="who" id="userWho"></span></h4>
      <div class="modal-actions">
        <button class="btn sm ghost" id="goAdmin" type="button" hidden>进入后台</button>
        <button class="btn sm ghost" id="doLogout" type="button">退出登录</button>
      </div>

      <h5 class="sub">申请添加网站</h5>
      <div class="apply-form">
        <input type="text" id="appUrl" name="apply-url" placeholder="网址（如 example.com）" autocomplete="off" />
        <input type="text" id="appName" name="apply-name" placeholder="名称（留空自动抓取）" autocomplete="off" />
        <input type="text" id="appDesc" name="apply-desc" placeholder="简介（可选）" autocomplete="off" />
        <select id="appCat" title="建议归类"><option value="">建议分类（可选）</option></select>
        <button class="btn primary" id="doApply" type="button">提交申请</button>
      </div>
      <p class="modal-msg" id="applyMsg"></p>

      <h5 class="sub">我的申请</h5>
      <div class="apply-list" id="myApps"><p class="hint">暂无申请记录</p></div>
    </div>
  </div>

  <script>
    /* 主题初始化：localStorage 优先，否则跟随系统 */
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="js/lunar.js?v=202609230133"></script>
  <script src="js/logos.js?v=202609230133"></script>
  <script src="js/app.js?v=202609230133"></script>
</body>
</html>
