# 共享导航 - Wrangler 配置
#
# 【重要】本文件【故意不写】 pages_build_output_dir。
#
# Cloudflare Pages 的规则（见官方文档 Pages Functions → Wrangler configuration）：
#   - 含 pages_build_output_dir
#       → 以本文件为生产配置唯一来源，后台 Settings → Functions 的绑定界面被禁用，
#         并显示 "Bindings for this project are being managed through wrangler.toml."
#   - 不含 pages_build_output_dir
#       → 本文件仅用于本地开发（wrangler pages dev）；
#         生产配置（含 KV / R2 绑定）由 Cloudflare 后台管理，可在后台随时增删改。
#
# 本项目选择「后台管理 KV / R2 绑定」，因此不添加该字段。
#
# ── 生产环境请在 Cloudflare 后台配置（详见 CLOUDFLARE.md）──────────────
#   1. Settings → Builds & deployments
#        Build command：留空
#        Build output directory：.（点号 = 仓库根目录）
#   2. Settings → Functions → KV namespace bindings → Add
#        Variable name：NAV_KV   → 选择你的 KV 命名空间
#   3. Settings → Functions → R2 buckets bindings → Add
#        Variable name：NAV_R2   → 选择桶 nav-site-uploads
#   4. 绑定改动后【必须重新部署】才生效（git push 自动触发，或 Deployments → Redeploy）。
# ────────────────────────────────────────────────────────────
#
# 若想改回「用 wrangler.toml 管理绑定」，只需把 pages_build_output_dir = "." 加回来即可。

name = "nav-site"
compatibility_date = "2024-11-01"

# 以下绑定仅供本地开发 `wrangler pages dev` 使用；生产绑定以 Cloudflare 后台为准。

# 导航数据 + 配置存储（替代本地 data/sites.json / config.json）
[[kv_namespaces]]
binding = "NAV_KV"
id = "3dd2c0201c3b478f9b43b424927fb9fc"

# 上传的图标/图片存储（替代本地 uploads/）
[[r2_buckets]]
binding = "NAV_R2"
bucket_name = "nav-site-uploads"
